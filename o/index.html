:root{--red:#E5303C;--saffron:#F5B82E;--sink:#2B1A00;--ground:#F2F2F7;--paper:#fff;--ink:#1B1418;--muted:#6B6268}
@media (prefers-color-scheme:dark){:root{--ground:#111;--paper:#1F1B1D;--ink:#F6EFEC;--muted:#B5AAAE}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;width:100%}
body{background:var(--ground);color:var(--ink);font:17px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;
 display:flex;flex-direction:column;align-items:center;padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));overflow-x:hidden}
.shop{font-weight:700;display:flex;gap:8px;align-items:center;margin-bottom:18px;position:relative;z-index:1}
.shop i{width:26px;height:26px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.wrap{position:relative;width:100%;max-width:340px}
.rings{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.rings span{position:absolute;inset:50% auto auto 50%;border-radius:50%;border:14px solid var(--red);opacity:.08;transform:translate(-50%,-50%);animation:p 1.8s ease-in-out infinite alternate}
.ready .rings span{border-color:var(--saffron);opacity:.18}
@keyframes p{to{transform:translate(-50%,-50%) scale(1.07)}}
@media (prefers-reduced-motion:reduce){.rings span{animation:none}}
.ticket{position:relative;border-radius:30px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.14);
 -webkit-mask:radial-gradient(circle 16px at 0 290px,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 16px at 100% 290px,#0000 98%,#000) right/51% 100% no-repeat}
.top{background:var(--paper);height:290px;display:grid;place-items:center;text-align:center;border-bottom:2px dashed rgba(127,127,127,.4)}
.top small{color:var(--muted);font-weight:600;font-size:17px}
.num{font-size:96px;font-weight:700;line-height:1.05;color:var(--red);font-variant-numeric:tabular-nums}
.stub{background:var(--red);color:#fff;min-height:150px;display:grid;place-items:center;text-align:center;padding:18px;transition:background .5s}
.ready .stub{background:var(--saffron);color:var(--sink)}
.stub b{display:block;font-size:26px}
.stub span{opacity:.88;font-size:15px}
.track{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:340px;margin-top:18px}
.track div{text-align:center;font-size:13px;color:var(--muted);font-weight:600}
.track div::before{content:"";display:block;height:6px;border-radius:3px;background:rgba(127,127,127,.22);margin-bottom:6px;transition:background .4s}
.track div.on::before{background:var(--red)}
.track.ready div.on::before,.track.done div.on::before{background:var(--saffron)}
.track div.now{color:var(--ink);font-weight:700}
.hidden{display:none!important}
.rate{position:relative;z-index:1;width:100%;max-width:340px;margin-top:16px;background:var(--paper);color:var(--ink);border-radius:22px;padding:14px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.faces{display:flex;gap:6px;margin-top:10px}.faces button{flex:1;font-size:30px;min-height:52px;border:0;border-radius:14px;background:rgba(127,127,127,.12);cursor:pointer}
.gbtn{display:block;margin-top:12px;padding:14px;border-radius:999px;background:var(--saffron);color:var(--sink,#1F1200);font-weight:800;text-decoration:none}
.share{position:relative;z-index:1;margin-top:14px;min-height:44px;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.cta{margin-top:22px;width:100%;max-width:340px;position:relative;z-index:1}
button,.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:18px;
 font-family:inherit;font-weight:700;font-size:17px;line-height:1;cursor:pointer;text-decoration:none}
.primary{background:var(--red);color:#fff}
.ghost{background:transparent;color:var(--muted);font-weight:600;margin-top:6px}
.note{color:var(--muted);text-align:center;font-size:15px;margin:12px 0 0}
.ok{color:#1E8E3E;font-weight:700}
:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
[hidden]{display:none!important}
/* بطاقة الأختام: ثلاث أشكال (ختم حبر، كوب يتعبّى، مشوار) */
.loyal{position:relative;z-index:1;width:100%;max-width:340px;margin-top:16px;border-radius:24px;padding:18px;color:#fff;
 background:var(--ly,#1B1418);box-shadow:0 10px 26px rgba(0,0,0,.18);overflow:hidden}
.loyal.light{color:#1a1a1a}
.loyal .wm{position:absolute;top:-30px;left:-20px;font-size:120px;opacity:.07;transform:rotate(-14deg);pointer-events:none}
.loyal.stamp{background:#F3E9D8;color:#3B2416}
.loyal.stamp::after{content:"";position:absolute;inset:6px;border:1.5px dashed color-mix(in srgb,var(--sink-ink,#8A2B1D) 30%,transparent);border-radius:18px;pointer-events:none}
.ly-top{display:flex;justify-content:space-between;align-items:baseline;position:relative}
.ly-top b{font-size:17px;display:block}.ly-top small{font-size:12px;opacity:.65}
.ly-n{font:600 28px/1 Georgia,"Times New Roman",serif;font-variant-numeric:tabular-nums}
.ly-stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0 12px;position:relative}
.ly-stamps i{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;
 border:1.5px dashed color-mix(in srgb,var(--sk) 35%,transparent);color:color-mix(in srgb,var(--sk) 50%,transparent)}
.ly-stamps i.gift{font-size:20px}
.ly-stamps i.on{border:2.5px solid var(--sk);color:inherit;font-size:21px;box-shadow:inset 0 0 0 3px #F3E9D8,inset 0 0 0 4px var(--sk);background:color-mix(in srgb,var(--sk) 8%,transparent);opacity:.92}
.ly-stamps i.pop{animation:slam .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes slam{0%{transform:scale(2.2) rotate(-30deg);opacity:0}100%{opacity:.92}}
.ly-cup{display:flex;gap:18px;align-items:center;position:relative}
.ly-cup svg{flex:0 0 104px;height:120px}
.ly-big{font:800 46px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums}.ly-big small{font-size:16px;opacity:.7;font-weight:600;margin-inline-start:4px}
.ly-bar{display:flex;gap:4px;margin-top:8px}.ly-bar span{flex:1;height:6px;border-radius:3px;background:currentColor;opacity:.2}.ly-bar span.on{background:var(--saffron);opacity:1}
.liq{transition:y .7s cubic-bezier(.3,1.3,.5,1),height .7s cubic-bezier(.3,1.3,.5,1)}
.ly-road{width:100%;display:block;margin-top:6px;position:relative}
.ly-road .tok{transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.ly-foot{font-size:14px;opacity:.85;margin-top:12px;position:relative}
.ly-gift{margin-top:12px;background:var(--saffron,#F5B82E);color:#2B1A00;border-radius:14px;padding:10px 12px;font-weight:800;text-align:center;position:relative;animation:slam .5s both}
.mplate{direction:ltr;display:grid;grid-template-columns:1fr 1fr 34px;border:2.5px solid #111;border-radius:10px;overflow:hidden;background:#fff;color:#111;width:250px;margin:8px auto 0;font-variant-numeric:tabular-nums}
.mplate .c{display:grid;grid-template-rows:1fr 1fr;border-right:2px solid #111;text-align:center}
.mplate .c span{font-weight:700;font-size:26px;letter-spacing:3px;min-height:44px;display:grid;place-items:center}
.mplate .c span+span{border-top:2px solid #111;font-family:ui-monospace,Menlo,monospace;font-size:22px}
.mplate .k{background:#111;color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;text-align:center;line-height:1.2}
.car{color:var(--muted);font-size:15px;margin-top:8px}
.bill{position:relative;z-index:1;width:100%;max-width:340px;margin-top:16px;background:var(--paper);border-radius:22px;padding:14px 16px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.bill div{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.bill .t{border-top:1px dashed rgba(127,127,127,.4);margin-top:6px;padding-top:8px;font-weight:800}
.bill p{margin:6px 0 0;color:var(--muted);font-size:14px}
footer{margin-top:auto;padding-top:26px;color:var(--muted);font-size:13px}
footer a{color:inherit}

  h+= full?`<div class="ly-gift">${esc(isAr?`🎁 عندك مكافأة: ${reward}. قلها للكاشير`:`🎁 You have a reward: ${reward}. Tell the cashier`)}</div>`:`<div class="ly-foot">${esc(foot)}</div>`;
  L.innerHTML=h;
  L.setAttribute('aria-label',(isAr?`${n} أختام من ${goal}. `:`${n} of ${goal} stamps. `)+(full?(isAr?'عندك مكافأة':'Reward ready'):foot));
  lyShown=n;
}
async function load(){
  if(!/^[0-9a-f-]{36}$/i.test(id)){ $('num').textContent='—'; $('title').textContent=T('الرابط ناقص'); $('sub').textContent=T('امسح الكود عند الكاشير مرة ثانية'); return; }
  const j=await rpc('get_order',{p_id:id});
  if(!j){
    // ممكن الطلب انكتب والنت فاصل عند الكاشير: نكمل نحاول دقيقتين قبل ما نقول ما لقيناه
    if(Date.now()-started<120000){ $('title').textContent=T('لحظة…'); return; }
    $('title').textContent=T('ما لقينا الطلب'); $('sub').textContent=T('تأكد من الكود عند الكاشير'); return;
  }
  lastJ=j;
  if(j.status!==lyStatus){ lyStatus=j.status; setTimeout(loadCard, j.status==='ready'?1500:0); }
  $('num').textContent=String(j.number??'—');
  if(j.kind==='carwash') wash(j);
  if(j.cafe&&j.cafe.name){ $('shop').textContent=j.cafe.name; document.title=T('طلب ')+j.number+' — '+j.cafe.name; }
  theme(j.cafe&&j.cafe.theme||{}, j.logo);
  const t=TXT[j.status]||TXT.preparing; $('title').textContent=t[0]; $('sub').textContent=t[1];
  $('wrap').classList.toggle('ready',j.status==='ready');
  const step={received:0,preparing:1,ready:2,collected:3}[j.status]??-1, names=(washed?['استلمناها','نغسلها','جاهزة','استلمتها']:['استلمنا','نحضّره','جاهز','استلمته']).map(T);
  const tr=$('track'); tr.classList.toggle('ready',j.status==='ready'); tr.classList.toggle('done',j.status==='collected');
  [...tr.children].forEach((d,i)=>{d.classList.toggle('on',i<=step);d.classList.toggle('now',i===step)});
  tr.setAttribute('aria-label',step>=0?(isAr?`مرحلة طلبك: ${names[step]}، ${step+1} من ٤`:`Your order: ${names[step]}, ${step+1} of 4`):T('انلغى الطلب'));
  if(last&&last!=='ready'&&j.status==='ready'){ playTone(); navigator.vibrate&&navigator.vibrate(VIB); }
  if(typeof j.google_review_url==='string'&&/^https:\/\//.test(j.google_review_url)) gurl=j.google_review_url;
  if(j.rating) rated=j.rating;
  const canRate=j.status==='ready'||j.status==='collected';
  $('rate').classList.toggle('hidden',!canRate); showRated();
  last=j.status;
}

// المغاسل: نعرض اللوحة والخدمات بدل رقم الطلب
const PL={'أ':'A','ب':'B','ح':'J','د':'D','ر':'R','س':'S','ص':'X','ط':'T','ع':'E','ق':'G','ك':'K','ل':'L','م':'Z','ن':'N','هـ':'H','و':'U','ى':'V'};
const ARD='٠١٢٣٤٥٦٧٨٩', ard=s=>String(s).replace(/\d/g,d=>ARD[d]);
const CN={white:['أبيض','White'],black:['أسود','Black'],silver:['فضي','Silver'],grey:['رمادي','Grey'],red:['أحمر','Red'],blue:['أزرق','Blue'],green:['أخضر','Green'],beige:['بيج','Beige'],brown:['بني','Brown'],gold:['ذهبي','Gold']};
function wash(j){
  if(!washed){
    washed=true;
    Object.assign(TXT,{received:[T('استلمنا سيارتك'),T('بنبدأ عليها الحين')],preparing:[T('نغسل سيارتك 🧽'),T('بنرسل لك تنبيه أول ما تخلص')],ready:[T('سيارتك جاهزة 🚗✨'),T('تفضل استلمها')],collected:[T('الله يسلمك!'),T('شكرًا لزيارتك')]});
    [...$('track').children].forEach((d,i)=>d.textContent=T(['استلمناها','نغسلها','جاهزة','استلمتها'][i]));
    $('rateQ').querySelector('b').textContent=T('وش رأيك بالغسيل؟');
    document.querySelector('.top small').textContent=T('سيارتك');
  }
  const num=$('num'); num.textContent=''; num.style.fontSize='0';
  const pl=document.createElement('div'); pl.className='mplate'; pl.setAttribute('role','img');
  const lets=(j.plate_letters||'').split(' ').filter(Boolean);
  const col=(a,b)=>{const c=document.createElement('div');c.className='c';const x=document.createElement('span');x.textContent=a;const y=document.createElement('span');y.textContent=b;c.append(x,y);return c;};
  const k=document.createElement('div'); k.className='k'; k.textContent='KSA';
  pl.append(col(ard(j.plate_num||j.number),j.plate_num||j.number),col(lets.join(' ')||'—',lets.map(l=>PL[l]||'').join(' ')||'—'),k);
  pl.setAttribute('aria-label',T('سيارتك')+': '+lets.join(' ')+' '+(j.plate_num||j.number));
  num.appendChild(pl);
  const info=[j.car_color&&CN[j.car_color]?CN[j.car_color][isAr?0:1]:'',j.car_type||''].filter(Boolean).join(' · ');
  if(info){const c=document.createElement('div');c.className='car';c.textContent=info;num.appendChild(c);}
  const sv=Array.isArray(j.services)?j.services:[]; const bill=$('bill');
  if(sv.length&&!bill.childElementCount){
    const money=v=>isAr?`${ard(Number(v))} ${T('ر.س')}`:`${Number(v)} SAR`;
    sv.forEach(x=>{const d=document.createElement('div');const a=document.createElement('span');a.textContent=x.name;const b=document.createElement('b');b.textContent=money(x.price);d.append(a,b);bill.appendChild(d);});
    const t=document.createElement('div');t.className='t';const a=document.createElement('span');a.textContent=T('المجموع');const b=document.createElement('span');b.textContent=money(j.total||0);t.append(a,b);bill.appendChild(t);
    const p=document.createElement('p');p.textContent=T('💵 الدفع عند السيارة');bill.appendChild(p);
    bill.hidden=false;
  }
}

function showRated(){
  $('rateQ').classList.toggle('hidden',!!rated); $('rateDone').classList.toggle('hidden',!rated);
  if(!rated) return;
  $('rateMsg').textContent=rated>=4?T('شكرًا! يسعدنا إنه عجبك 🙏'):T('شكرًا على رأيك، بنتحسن 🙏');
  const g=$('google'); if(rated>=4&&gurl){ g.href=gurl; g.classList.remove('hidden'); } else g.classList.add('hidden');
}
document.querySelectorAll('.faces button').forEach(b=>b.onclick=()=>{ rated=+b.dataset.r; showRated(); rpc('rate_order',{p_id:id,p_rating:rated}); });
$('share').onclick=async()=>{
  const url=location.origin+'/o/?id='+id;
  try{ if(navigator.share){ await navigator.share({title:T('تابع طلبي في Tonsa'),url}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(url); $('share').textContent=T('انسخ الرابط ✓'); }catch(e){}
};
// يرسم التذكرة صورة: العميل يرسلها لأحد يستلم عنه
let lastJ=null;
$('saveimg').onclick=async()=>{
  const j=lastJ; if(!j) return;
  const W=1080,H=1350,c=document.createElement('canvas'); c.width=W;c.height=H; const g=c.getContext('2d');
  const css=getComputedStyle(document.documentElement), red=css.getPropertyValue('--red').trim()||'#E5303C', saf=css.getPropertyValue('--saffron').trim()||'#F5B82E';
  const F='"IBM Plex Sans Arabic",system-ui,sans-serif'; g.direction=document.documentElement.dir; g.textAlign='center';
  g.fillStyle='#F2F2F7'; g.fillRect(0,0,W,H);
  g.fillStyle='#fff'; g.beginPath(); g.roundRect(90,170,900,1000,60); g.fill();
  const ready=j.status==='ready'; g.fillStyle=ready?saf:red; g.beginPath(); g.roundRect(90,830,900,340,[0,0,60,60]); g.fill();
  g.fillStyle='#1B1418'; g.font='700 52px '+F; g.fillText((j.cafe&&j.cafe.name)||'Tonsa',W/2,120);
  g.fillStyle='#6B6268'; g.font='600 48px '+F; g.fillText(T(j.kind==='carwash'?'سيارتك':'رقم طلبك'),W/2,330);
  const big=j.kind==='carwash'?((j.plate_letters?j.plate_letters+'  ':'')+(j.plate_num||j.number)):String(j.number);
  g.fillStyle=red; g.font='700 '+(big.length>6?150:240)+'px '+F; g.fillText(big,W/2,600);
  g.fillStyle=ready?'#2B1A00':'#fff'; g.font='700 64px '+F; g.fillText($('title').textContent,W/2,980);
  g.font='500 40px '+F; g.fillText($('sub').textContent,W/2,1060);
  g.fillStyle='#9a9a9a'; g.font='600 34px '+F; g.fillText('Tonsa',W/2,1260);
  const blob=await new Promise(r=>c.toBlob(r,'image/png')); const file=new File([blob],'tonsa-ticket.png',{type:'image/png'});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; } }catch(e){ return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='tonsa-ticket.png'; a.click();
};
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const p='='.repeat((4-s.length%4)%4);const r=atob(s+p);return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function enable(){
  const btn=$('notify'); btn.disabled=true; btn.textContent=T('لحظة…');
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ $('nnote').textContent=T('التنبيهات مقفلة. افتح إعدادات المتصفح واسمح بالتنبيهات لهذا الموقع.'); btn.disabled=false; btn.textContent=T('🔔 فعّل التنبيه'); return; }
    const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/'}); await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});
    const k=sub.toJSON();
    const ok=await rpc('register_web_push',{p_id:id,p_endpoint:k.endpoint,p_p256dh:k.keys.p256dh,p_auth:k.keys.auth,p_lang:LANG});
    if(ok===false) throw new Error('reg');
    try{localStorage.setItem('tonsa-on-'+id,'1')}catch(e){}
    $('android').hidden=true; $('on').hidden=false; chime();
  }catch(e){ $('nnote').textContent=T('ما قدرنا نفعّل التنبيه على هذا الجوال. خلّ الصفحة مفتوحة وبتسمع النداء.'); btn.disabled=false; btn.textContent=T('🔔 جرّب مرة ثانية'); }
}

if(isIOS){
  $('ios').hidden=false;
  $('clip').href='https://appclip.apple.com/id?p=sa.digitalinsights.tonsa.Clip&id='+encodeURIComponent(id);
}else if('serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window){
  let on=false; try{on=localStorage.getItem('tonsa-on-'+id)==='1'}catch(e){}
  if(on&&Notification.permission==='granted'){ $('on').hidden=false; navigator.serviceWorker.register('/sw.js',{scope:'/'}); }
  else { $('android').hidden=false; $('notify').addEventListener('click',enable); }
}else{
  $('on').hidden=false; $('on').className='note'; $('on').textContent=T('خلّ هذي الصفحة مفتوحة، وبتسمع النداء أول ما يجهز طلبك.');
}
load(); setInterval(load,5000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
}
