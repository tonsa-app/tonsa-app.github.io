<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E5303C">
<meta name="apple-itunes-app" content="app-id=6838883741, app-clip-bundle-id=sa.digitalinsights.tonsa.Clip, app-clip-display=card">
<title>تذكرة طلبك — Tonsa</title>
<link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E5303C;--saffron:#F5B82E;--sink:#2B1A00;--ground:#F2F2F7;--paper:#fff;--ink:#1B1418;--muted:#6B6268}
@media (prefers-color-scheme:dark){:root{--ground:#111;--paper:#1F1B1D;--ink:#F6EFEC;--muted:#B5AAAE}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;width:100%}
body{background:var(--ground);color:var(--ink);font:17px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;
 display:flex;flex-direction:column;align-items:center;padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));overflow-x:hidden}
.shop{font-weight:700;display:flex;gap:8px;align-items:center;margin-bottom:18px;position:relative;z-index:1}
.shop i{width:26px;height:26px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.wrap{position:relative;width:100%;max-width:340px}
.rings{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.rings span{position:absolute;inset:50% auto auto 50%;border-radius:50%;border:14px solid var(--red);opacity:.08;transform:translate(-50%,-50%);animation:p 1.8s ease-in-out infinite alternate}
.ready .rings span{border-color:var(--saffron);opacity:.18}
@keyframes p{to{transform:translate(-50%,-50%) scale(1.07)}}
@media (prefers-reduced-motion:reduce){.rings span{animation:none}}
.ticket{position:relative;border-radius:30px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.14);
 -webkit-mask:radial-gradient(circle 16px at 0 290px,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 16px at 100% 290px,#0000 98%,#000) right/51% 100% no-repeat}
.top{background:var(--paper);height:290px;display:grid;place-items:center;text-align:center;border-bottom:2px dashed rgba(127,127,127,.4)}
.top small{color:var(--muted);font-weight:600;font-size:17px}
.num{font-size:96px;font-weight:700;line-height:1.05;color:var(--red);font-variant-numeric:tabular-nums}
.stub{background:var(--red);color:#fff;min-height:150px;display:grid;place-items:center;text-align:center;padding:18px;transition:background .5s}
.ready .stub{background:var(--saffron);color:var(--sink)}
.stub b{display:block;font-size:26px}
.stub span{opacity:.88;font-size:15px}
.track{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:340px;margin-top:18px}
.track div{text-align:center;font-size:13px;color:var(--muted);font-weight:600}
.track div::before{content:"";display:block;height:6px;border-radius:3px;background:rgba(127,127,127,.22);margin-bottom:6px;transition:background .4s}
.track div.on::before{background:var(--red)}
.track.ready div.on::before,.track.done div.on::before{background:var(--saffron)}
.track div.now{color:var(--ink);font-weight:700}
.hidden{display:none!important}
.rate{position:relative;z-index:1;width:100%;max-width:340px;margin-top:16px;background:var(--paper);color:var(--ink);border-radius:22px;padding:14px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.faces{display:flex;gap:6px;margin-top:10px}.faces button{flex:1;font-size:30px;min-height:52px;border:0;border-radius:14px;background:rgba(127,127,127,.12);cursor:pointer}
.gbtn{display:block;margin-top:12px;padding:14px;border-radius:999px;background:var(--saffron);color:var(--sink,#1F1200);font-weight:800;text-decoration:none}
.share{position:relative;z-index:1;margin-top:14px;min-height:44px;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.cta{margin-top:22px;width:100%;max-width:340px;position:relative;z-index:1}
button,.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:18px;
 font-family:inherit;font-weight:700;font-size:17px;line-height:1;cursor:pointer;text-decoration:none}
.primary{background:var(--red);color:#fff}
.ghost{background:transparent;color:var(--muted);font-weight:600;margin-top:6px}
.note{color:var(--muted);text-align:center;font-size:15px;margin:12px 0 0}
.ok{color:#1E8E3E;font-weight:700}
:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
[hidden]{display:none!important}
footer{margin-top:auto;padding-top:26px;color:var(--muted);font-size:13px}
footer a{color:inherit}
</style></head><body>
<div class="shop"><i aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zm0 19a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22z"/></svg></i><span id="shop">Tonsa</span></div>
<main class="wrap" id="wrap">
 <div class="rings" aria-hidden="true"><span style="width:340px;height:340px"></span><span style="width:450px;height:450px"></span><span style="width:560px;height:560px"></span></div>
 <div class="ticket" role="status" aria-live="polite">
  <div class="top"><div><small>رقم طلبك</small><div class="num" id="num">…</div></div></div>
  <div class="stub"><div><b id="title">نجيب طلبك…</b><span id="sub">لحظة</span></div></div>
 </div>
</main>
<div class="track" id="track" role="img" aria-label="مرحلة طلبك"><div>استلمنا</div><div>نحضّره</div><div>جاهز</div><div>استلمته</div></div>
<div class="rate hidden" id="rate">
  <div id="rateQ"><b>وش رأيك بطلبك؟</b><div class="faces">
    <button data-r="1" aria-label="تقييم 1 من 5">😞</button><button data-r="2" aria-label="تقييم 2 من 5">😕</button><button data-r="3" aria-label="تقييم 3 من 5">😐</button><button data-r="4" aria-label="تقييم 4 من 5">🙂</button><button data-r="5" aria-label="تقييم 5 من 5">😍</button></div></div>
  <div id="rateDone" class="hidden"><b id="rateMsg"></b><a id="google" class="gbtn hidden" target="_blank" rel="noopener">⭐ قيّمنا في قوقل</a></div>
</div>
<button class="share" id="share" type="button">↗ شارك التذكرة مع صاحبك</button>
<div class="cta">
 <div id="ios" hidden>
  <a class="btn primary" id="clip">افتح تذكرتك في Tonsa</a>
  <p class="note">يفتح بدون تحميل، ونناديك حتى لو جوالك مقفل.</p>
 </div>
 <div id="android" hidden>
  <button class="primary" id="notify">🔔 فعّل التنبيه</button>
  <p class="note" id="nnote">اضغط مرة وحدة، ونرسل لك تنبيه أول ما يجهز طلبك حتى لو جوالك مقفل.</p>
 </div>
 <p class="note ok" id="on" hidden>✓ التنبيه مفعّل. تقدر تقفل جوالك الحين.</p>
</div>
<footer>Tonsa · <a href="/">رؤى الرقمية</a></footer>
<script>
{
// اللغة: عربي لو الجوال عربي، وإلا إنقليزي
const isAr=(navigator.languages&&navigator.languages[0]||navigator.language||'ar').toLowerCase().startsWith('ar');
const EN={'وش رأيك بطلبك؟':'How was your order?','⭐ قيّمنا في قوقل':'⭐ Rate us on Google','↗ شارك التذكرة مع صاحبك':'↗ Share this ticket with a friend','شكرًا! يسعدنا إنه عجبك 🙏':'Thanks! Glad you liked it 🙏','شكرًا على رأيك، بنتحسن 🙏':'Thanks for the feedback, we\'ll do better 🙏','انسخ الرابط ✓':'Link copied ✓','تابع طلبي في Tonsa':'Follow my order on Tonsa','تذكرة طلبك — Tonsa':'Your order ticket — Tonsa','رقم طلبك':'Your order','نجيب طلبك…':'Loading your order…','لحظة':'One moment',
'افتح تذكرتك في Tonsa':'Open your ticket in Tonsa','يفتح بدون تحميل، ونناديك حتى لو جوالك مقفل.':'Opens without downloading, and we call you even if your phone is locked.',
'🔔 فعّل التنبيه':'🔔 Turn on alerts','اضغط مرة وحدة، ونرسل لك تنبيه أول ما يجهز طلبك حتى لو جوالك مقفل.':'Tap once and we\'ll alert you as soon as your order is ready, even if your phone is locked.',
'✓ التنبيه مفعّل. تقدر تقفل جوالك الحين.':'✓ Alerts are on. You can lock your phone now.','رؤى الرقمية':'Digital Insights',
'استلمنا':'Received','نحضّره':'Preparing','جاهز':'Ready','استلمته':'Picked up','مرحلة طلبك':'Your order stage',
'استلمنا طلبك':'We got your order','بنبدأ نجهزه الحين':'We\'ll start preparing it now','طلبك يتجهز':'Your order is being prepared','بنرسل لك تنبيه أول ما يجهز':'We\'ll alert you as soon as it\'s ready',
'طلبك جاهز 🎉':'Your order is ready 🎉','تفضل استلمه من الكاشير':'Please pick it up at the counter','بالعافية!':'Enjoy!','شكرًا لزيارتك':'Thanks for visiting',
'انلغى الطلب':'Order cancelled','كلّم الكاشير لو عندك سؤال':'Ask the cashier if you have a question',
'الرابط ناقص':'Incomplete link','امسح الكود عند الكاشير مرة ثانية':'Scan the code at the counter again','ما لقينا الطلب':'Order not found','تأكد من الكود عند الكاشير':'Check the code at the counter',
'طلب ':'Order ','لحظة…':'One moment…','التنبيهات مقفلة. افتح إعدادات المتصفح واسمح بالتنبيهات لهذا الموقع.':'Notifications are blocked. Open your browser settings and allow notifications for this site.',
'ما قدرنا نفعّل التنبيه على هذا الجوال. خلّ الصفحة مفتوحة وبتسمع النداء.':'We couldn\'t turn on alerts on this phone. Keep this page open and you\'ll hear the call.',
'🔔 جرّب مرة ثانية':'🔔 Try again','خلّ هذي الصفحة مفتوحة، وبتسمع النداء أول ما يجهز طلبك.':'Keep this page open and you\'ll hear the call when your order is ready.'};
const T=(s)=>isAr?s:(EN[s]||s);
if(!isAr){
  document.documentElement.lang='en'; document.documentElement.dir='ltr'; document.title=T(document.title);
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  for(let n;(n=w.nextNode());){const k=n.nodeValue.trim(); if(k&&EN[k]) n.nodeValue=n.nodeValue.replace(k,EN[k]);}
  document.querySelectorAll('[aria-label]').forEach(e=>{const k=e.getAttribute('aria-label'); if(EN[k]) e.setAttribute('aria-label',EN[k]);});
}

const SB='https://mqwtgwqyohrrvfjqwtgm.supabase.co', KEY='sb_publishable_Dudu901qJs-L-_JqynRQ6Q_dYUVj0vX';
const VAPID='BNu1oHzNO_Ay89DhPQGeAoccyaw3_YXBEXqRVDyC_tP8pDBHDnWHKYw4cbpEUf9VCUYtrjTDfplOLxhE5eYbHtk';
const id=new URLSearchParams(location.search).get('id')||'';
const $=(x)=>document.getElementById(x);
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const TXT={received:[T('استلمنا طلبك'),T('بنبدأ نجهزه الحين')],preparing:[T('طلبك يتجهز'),T('بنرسل لك تنبيه أول ما يجهز')],ready:[T('طلبك جاهز 🎉'),T('تفضل استلمه من الكاشير')],
 collected:[T('بالعافية!'),T('شكرًا لزيارتك')],cancelled:[T('انلغى الطلب'),T('كلّم الكاشير لو عندك سؤال')]};
let last=null, started=Date.now(), rated=null, gurl=null;
const VIB=[90,60,90,60,90,140,600]; // اهتزاز Tonsa المميز
const rpc=(fn,body)=>fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(body)}).then(r=>r.ok?r.json():null).catch(()=>null);

function chime(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach((t,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=[880,1175,1568][i];g.gain.setValueAtTime(.0001,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,a.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+.5);o.connect(g).connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.55)})}catch(e){}}

const HEX=/^#[0-9a-fA-F]{6}$/;
function lum(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]}
let themed='';
function theme(t,logo){
  const key=JSON.stringify(t)+(logo?logo.length:0); if(key===themed) return; themed=key;
  const r=document.documentElement.style;
  if(HEX.test(t.primary||'')){ r.setProperty('--red',t.primary); document.querySelector('meta[name=theme-color]').content=t.primary; }
  if(HEX.test(t.accent||'')){ r.setProperty('--saffron',t.accent); r.setProperty('--sink',lum(t.accent)>.4?'#1F1200':'#FFFFFF'); }
  if(typeof t.ready_title==='string'&&t.ready_title&&t.ready_title!=='طلبك جاهز') TXT.ready[0]=t.ready_title;
  if(typeof t.ready_subtitle==='string'&&t.ready_subtitle&&t.ready_subtitle!=='تفضل استلمه من الكاشير') TXT.ready[1]=t.ready_subtitle;
  if(typeof logo==='string'&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(logo)){
    const i=document.querySelector('.shop i'); i.textContent=''; const im=document.createElement('img');
    im.src=logo; im.alt=''; im.style.cssText='width:100%;height:100%;border-radius:50%;object-fit:cover'; i.appendChild(im);
    i.style.width='32px'; i.style.height='32px';
  }
}
async function load(){
  if(!/^[0-9a-f-]{36}$/i.test(id)){ $('num').textContent='—'; $('title').textContent=T('الرابط ناقص'); $('sub').textContent=T('امسح الكود عند الكاشير مرة ثانية'); return; }
  const j=await rpc('get_order',{p_id:id});
  if(!j){
    // ممكن الطلب انكتب والنت فاصل عند الكاشير: نكمل نحاول دقيقتين قبل ما نقول ما لقيناه
    if(Date.now()-started<120000){ $('title').textContent=T('لحظة…'); return; }
    $('title').textContent=T('ما لقينا الطلب'); $('sub').textContent=T('تأكد من الكود عند الكاشير'); return;
  }
  $('num').textContent=String(j.number??'—');
  if(j.cafe&&j.cafe.name){ $('shop').textContent=j.cafe.name; document.title=T('طلب ')+j.number+' — '+j.cafe.name; }
  theme(j.cafe&&j.cafe.theme||{}, j.logo);
  const t=TXT[j.status]||TXT.preparing; $('title').textContent=t[0]; $('sub').textContent=t[1];
  $('wrap').classList.toggle('ready',j.status==='ready');
  const step={received:0,preparing:1,ready:2,collected:3}[j.status]??-1, names=[T('استلمنا'),T('نحضّره'),T('جاهز'),T('استلمته')];
  const tr=$('track'); tr.classList.toggle('ready',j.status==='ready'); tr.classList.toggle('done',j.status==='collected');
  [...tr.children].forEach((d,i)=>{d.classList.toggle('on',i<=step);d.classList.toggle('now',i===step)});
  tr.setAttribute('aria-label',step>=0?(isAr?`مرحلة طلبك: ${names[step]}، ${step+1} من ٤`:`Your order: ${names[step]}, ${step+1} of 4`):T('انلغى الطلب'));
  if(last&&last!=='ready'&&j.status==='ready'){ chime(); navigator.vibrate&&navigator.vibrate(VIB); }
  if(typeof j.google_review_url==='string'&&/^https:\/\//.test(j.google_review_url)) gurl=j.google_review_url;
  if(j.rating) rated=j.rating;
  const canRate=j.status==='ready'||j.status==='collected';
  $('rate').classList.toggle('hidden',!canRate); showRated();
  last=j.status;
}

function showRated(){
  $('rateQ').classList.toggle('hidden',!!rated); $('rateDone').classList.toggle('hidden',!rated);
  if(!rated) return;
  $('rateMsg').textContent=rated>=4?T('شكرًا! يسعدنا إنه عجبك 🙏'):T('شكرًا على رأيك، بنتحسن 🙏');
  const g=$('google'); if(rated>=4&&gurl){ g.href=gurl; g.classList.remove('hidden'); } else g.classList.add('hidden');
}
document.querySelectorAll('.faces button').forEach(b=>b.onclick=()=>{ rated=+b.dataset.r; showRated(); rpc('rate_order',{p_id:id,p_rating:rated}); });
$('share').onclick=async()=>{
  const url=location.origin+'/o/?id='+id;
  try{ if(navigator.share){ await navigator.share({title:T('تابع طلبي في Tonsa'),url}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(url); $('share').textContent=T('انسخ الرابط ✓'); }catch(e){}
};
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const p='='.repeat((4-s.length%4)%4);const r=atob(s+p);return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function enable(){
  const btn=$('notify'); btn.disabled=true; btn.textContent=T('لحظة…');
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ $('nnote').textContent=T('التنبيهات مقفلة. افتح إعدادات المتصفح واسمح بالتنبيهات لهذا الموقع.'); btn.disabled=false; btn.textContent=T('🔔 فعّل التنبيه'); return; }
    const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/'}); await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});
    const k=sub.toJSON();
    const ok=await rpc('register_web_push',{p_id:id,p_endpoint:k.endpoint,p_p256dh:k.keys.p256dh,p_auth:k.keys.auth,p_lang:isAr?'ar':'en'});
    if(ok===false) throw new Error('reg');
    try{localStorage.setItem('tonsa-on-'+id,'1')}catch(e){}
    $('android').hidden=true; $('on').hidden=false; chime();
  }catch(e){ $('nnote').textContent=T('ما قدرنا نفعّل التنبيه على هذا الجوال. خلّ الصفحة مفتوحة وبتسمع النداء.'); btn.disabled=false; btn.textContent=T('🔔 جرّب مرة ثانية'); }
}

if(isIOS){
  $('ios').hidden=false;
  $('clip').href='https://appclip.apple.com/id?p=sa.digitalinsights.tonsa.Clip&id='+encodeURIComponent(id);
}else if('serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window){
  let on=false; try{on=localStorage.getItem('tonsa-on-'+id)==='1'}catch(e){}
  if(on&&Notification.permission==='granted'){ $('on').hidden=false; navigator.serviceWorker.register('/sw.js',{scope:'/'}); }
  else { $('android').hidden=false; $('notify').addEventListener('click',enable); }
}else{
  $('on').hidden=false; $('on').className='note'; $('on').textContent=T('خلّ هذي الصفحة مفتوحة، وبتسمع النداء أول ما يجهز طلبك.');
}
load(); setInterval(load,5000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
}
</script>
</body></html>
